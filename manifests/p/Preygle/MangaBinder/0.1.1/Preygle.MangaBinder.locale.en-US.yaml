ShortDescription: Download manga chapters, convert them to PDF, bind them into volumes and export CBZ.
Description: |-
  MangaBinder downloads every chapter of a manga series from an online reader, converts the chapters to PDF,
  binds them into volumes using MangaDex / AniList volume data (with a bookmark per chapter) and exports CBZ
  for e-readers. Run `mangabinder` to open the browser interface, or use the command line, e.g.
  `mangabinder download URL --volumes`.
